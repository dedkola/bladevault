name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  pull-requests: read

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Read package version
        id: package
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          if [ -z "$version" ]; then
            echo "::error::Failed to read version from package.json"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Validate tag matches package version
        env:
          TAG: ${{ github.ref_name }}
          VERSION: ${{ steps.package.outputs.version }}
        run: |
          set -euo pipefail
          expected_tag="v${VERSION}"
          if [ "$TAG" != "$expected_tag" ]; then
            echo "::error title=Tag/version mismatch::Tag '$TAG' does not match package.json version '$VERSION'. Expected '$expected_tag'."
            exit 1
          fi

      - name: Build release notes
        id: notes
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          # Same check as desktop-release.yml: the macOS build is signed only
          # when every Apple secret is set.
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_SIGNING_CERTIFICATE_BASE64: ${{ secrets.APPLE_SIGNING_CERTIFICATE_BASE64 }}
          APPLE_SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_SIGNING_CERTIFICATE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail

          if [ -n "$APPLE_SIGNING_CERTIFICATE_BASE64" ] && [ -n "$APPLE_SIGNING_CERTIFICATE_PASSWORD" ] && [ -n "$APPLE_ID" ] && [ -n "$APPLE_APP_SPECIFIC_PASSWORD" ] && [ -n "$APPLE_TEAM_ID" ]; then
            export MAC_RELEASE_KIND=signed
          else
            export MAC_RELEASE_KIND=unsigned
          fi

          previous_tag="$(git describe --tags --abbrev=0 "${TAG}^" 2>/dev/null || true)"
          notes_file="$RUNNER_TEMP/release-notes.md"
          node scripts/release-notes.cjs "$previous_tag" "$TAG" > "$notes_file"

          echo "path=$notes_file" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          body_path: ${{ steps.notes.outputs.path }}
