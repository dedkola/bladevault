name: Test

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  # The PR run already checked the merged code, so pushes to main only publish
  # the container instead of repeating the whole test job.
  test:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          cache: npm
          node-version-file: '.nvmrc'

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Validate GitHub Actions workflows
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/repo" \
            -w /repo \
            rhysd/actionlint:1.7.12 \
            -shellcheck=

      - name: Lint
        run: npm run lint

      - name: Run unit and integration tests
        run: npm run test

      # Cloudflare Workers Builds builds the static app on every commit, and
      # browser tests run locally (`npm run test:e2e`), not on every PR.
      - name: Build production app
        run: npm run build

      # The Electron smoke covers what the web suite cannot: launch, the
      # preload boundary and better-sqlite3 built for Electron. Run it on PRs
      # that change the desktop runtime or dependencies, and on manual runs.
      # Pushes to main reuse the PR result; cross-platform runs are weekly.
      - name: Detect desktop-sensitive changes
        id: desktop
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            echo "required=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ "$EVENT_NAME" != "pull_request" ]]; then
            echo "required=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if git diff --name-only "$BASE_SHA"...HEAD | grep -Eq '^(electron/|scripts/(prepare-desktop-build|run-desktop-smoke|sync-desktop-runtime-deps)|package-lock\.json$|electron-builder\.config\.cjs$|\.nvmrc$)'; then
            echo "required=true" >> "$GITHUB_OUTPUT"
          else
            echo "required=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Run Electron smoke test
        if: steps.desktop.outputs.required == 'true'
        run: xvfb-run -a npm run desktop:smoke

  publish-container:
    name: Verify & publish container
    if: github.event_name == 'push'
    permissions:
      attestations: write
      contents: read
      id-token: write
      packages: write
      security-events: write
    uses: ./.github/workflows/docker-build.yml
    secrets: inherit
