name: Cross-platform Desktop Smoke

on:
  pull_request:
    paths:
      - 'electron/**'
      - 'lib/local-db.ts'
      - 'lib/storage/**'
      - 'scripts/prepare-desktop-build.cjs'
      - 'scripts/run-desktop-smoke.cjs'
      - 'scripts/sync-desktop-runtime-deps.cjs'
      - 'electron-builder.config.cjs'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/desktop-smoke.yml'
  push:
    branches:
      - main
    paths:
      - 'electron/**'
      - 'lib/local-db.ts'
      - 'lib/storage/**'
      - 'scripts/prepare-desktop-build.cjs'
      - 'scripts/run-desktop-smoke.cjs'
      - 'scripts/sync-desktop-runtime-deps.cjs'
      - 'electron-builder.config.cjs'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/desktop-smoke.yml'
  schedule:
    - cron: '47 4 * * 2'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-latest
          - windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          cache: npm
          node-version-file: '.nvmrc'

      - name: Restore Electron download cache
        uses: actions/cache@v5
        with:
          path: ${{ runner.tool_cache }}/electron
          key: electron-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        run: npm ci

      - name: Run desktop smoke test
        run: npm run desktop:smoke
        env:
          electron_config_cache: ${{ runner.tool_cache }}/electron
