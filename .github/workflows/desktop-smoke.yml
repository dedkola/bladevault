name: Cross-platform Desktop Smoke

on:
  pull_request:
    paths:
      - 'electron/**'
      - 'lib/local-db.ts'
      - 'lib/storage/**'
      - 'scripts/prepare-desktop-build.cjs'
      - 'scripts/run-desktop-smoke.cjs'
      - 'scripts/sync-desktop-runtime-deps.cjs'
      - 'electron-builder.config.cjs'
      - 'package.json'
      - 'package-lock.json'
      - '.nvmrc'
      - '.github/workflows/desktop-smoke.yml'
  push:
    branches:
      - main
    paths:
      - 'electron/**'
      - 'lib/local-db.ts'
      - 'lib/storage/**'
      - 'scripts/prepare-desktop-build.cjs'
      - 'scripts/run-desktop-smoke.cjs'
      - 'scripts/sync-desktop-runtime-deps.cjs'
      - 'electron-builder.config.cjs'
      - 'package.json'
      - 'package-lock.json'
      - '.nvmrc'
      - '.github/workflows/desktop-smoke.yml'
  schedule:
    - cron: '47 4 * * 2'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    # macOS runners are frequently slow to allocate; 15 min killed jobs that
    # had not even run a single step yet. Keep a generous ceiling so a hung
    # job still dies well before GitHub's 6h default.
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-latest
          - windows-2022
          - ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          cache: npm
          node-version-file: '.nvmrc'

      - name: Restore Electron download cache
        uses: actions/cache@v6
        with:
          path: ${{ runner.tool_cache }}/electron
          key: electron-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        run: npm ci

      # The runner image already ships most Chromium shared libraries; install
      # only what is missing. Hosted runners occasionally fail to resolve the
      # Ubuntu mirror, so retry and treat a partial install as a warning: the
      # smoke step below is the real verification.
      # The ubuntu-22.04 runner image already provides Xvfb and the Chromium
      # shared libraries Electron needs, so skip apt entirely (hosted runners
      # intermittently fail to resolve the Ubuntu mirror) and fail fast with a
      # readable list if an image update ever drops one of them.
      - name: Check Linux runtime libraries
        if: runner.os == 'Linux'
        run: |
          command -v xvfb-run >/dev/null || { echo '::error::xvfb-run is not available'; exit 1; }
          if ldd node_modules/electron/dist/electron | grep 'not found'; then
            echo '::error::Electron is missing the shared libraries listed above'
            exit 1
          fi

      - name: Run desktop smoke test
        if: runner.os != 'Linux'
        run: npm run desktop:smoke
        env:
          electron_config_cache: ${{ runner.tool_cache }}/electron

      # GitHub's Linux runners run headless, so Electron needs a virtual display.
      - name: Run desktop smoke test (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run --auto-servernum npm run desktop:smoke
        env:
          electron_config_cache: ${{ runner.tool_cache }}/electron

      - name: Package Windows installer
        if: runner.os == 'Windows'
        run: npx electron-builder --config electron-builder.config.cjs --win nsis --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          electron_config_cache: ${{ runner.tool_cache }}/electron

      - name: Locate Windows installer
        if: runner.os == 'Windows'
        id: installer
        shell: pwsh
        run: |
          $installer = Get-ChildItem -Path dist/desktop -Filter 'BladeVault-Setup.exe' -Recurse | Select-Object -First 1
          if (-not $installer -or $installer.Length -eq 0) {
            throw 'Windows installer was not produced.'
          }
          "path=$($installer.FullName)" >> $env:GITHUB_OUTPUT
          Write-Output "Built $($installer.FullName) ($($installer.Length) bytes)"

      - name: Upload Windows installer
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v7
        with:
          name: windows-installer
          path: ${{ steps.installer.outputs.path }}
          if-no-files-found: error
          retention-days: 7

      - name: Package Linux AppImage and deb
        if: runner.os == 'Linux'
        run: npx electron-builder --config electron-builder.config.cjs --linux --publish never
        env:
          electron_config_cache: ${{ runner.tool_cache }}/electron

      - name: Upload Linux packages
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v7
        with:
          name: linux-packages
          path: |
            dist/desktop/BladeVault.AppImage
            dist/desktop/BladeVault.deb
            dist/desktop/latest-linux.yml
          if-no-files-found: error
          retention-days: 7
