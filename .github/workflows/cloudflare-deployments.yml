name: Report Cloudflare deployments

on:
  check_run:
    types: [completed]
  # Also reconcile after CI: GitHub can suppress check_run workflow events.
  workflow_run:
    workflows: [Test]
    types: [completed]
  workflow_dispatch:
    inputs:
      commit_sha:
        description: 'Commit SHA to report (blank uses the default branch head)'
        required: false
        type: string

permissions:
  contents: read
  checks: read
  deployments: write

concurrency:
  group: cloudflare-deployment-${{ github.event.check_run.head_sha || github.event.workflow_run.head_sha || inputs.commit_sha || github.sha }}
  cancel-in-progress: false

jobs:
  report:
    if: >-
      github.event_name != 'check_run' ||
      (github.event.check_run.app.id == 85455 &&
       github.event.check_run.name == 'Workers Builds: bladevault')
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check out trusted reporting code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Record Cloudflare build results in GitHub
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const report = require('./.github/scripts/report-cloudflare-deployment.cjs')
            await report({ github, context, core })
