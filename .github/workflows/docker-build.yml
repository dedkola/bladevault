name: Build & Push Docker Image

on:
  workflow_call:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: docker-publish-${{ github.ref }}
  cancel-in-progress: ${{ github.ref == 'refs/heads/main' }}

jobs:
  build-test-push:
    name: Build, test & scan (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    permissions:
      attestations: write
      contents: read
      id-token: write
      packages: write
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-latest
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    env:
      DOCKER_IMAGE: docker.io/${{ secrets.DOCKERHUB_USERNAME }}/bladevault
      GHCR_IMAGE: ghcr.io/${{ github.repository }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Prepare image tags
        id: image
        shell: bash
        run: |
          short_sha="${GITHUB_SHA::7}"
          echo "ghcr=${GHCR_IMAGE}:sha-${short_sha}-${{ matrix.arch }}" >> "$GITHUB_OUTPUT"
          echo "docker=${DOCKER_IMAGE}:sha-${short_sha}-${{ matrix.arch }}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build testable image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          load: true
          tags: |
            ${{ steps.image.outputs.ghcr }}
            ${{ steps.image.outputs.docker }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false

      - name: Test container startup and persistence
        run: .github/scripts/container-smoke.sh "${{ steps.image.outputs.ghcr }}"

      - name: Scan candidate image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ steps.image.outputs.ghcr }}
          format: sarif
          output: trivy-results.sarif
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          scanners: vuln
          version: v0.74.0
          exit-code: '0'

      - name: Upload container scan results
        if: always() && hashFiles('trivy-results.sarif') != ''
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-results.sarif
          category: container-candidate-${{ matrix.arch }}

      - name: Generate image SBOM
        run: |
          trivy image \
            --format spdx-json \
            --output "sbom-${{ matrix.arch }}.spdx.json" \
            --scanners vuln \
            "${{ steps.image.outputs.ghcr }}"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push tested architecture image
        run: |
          docker push "${{ steps.image.outputs.ghcr }}"
          docker push "${{ steps.image.outputs.docker }}"

      - name: Read GHCR image digest
        id: digest
        run: |
          digest="$(docker buildx imagetools inspect \
            "${{ steps.image.outputs.ghcr }}" \
            --format '{{json .Manifest}}' | jq -r '.digest')"
          test "$digest" != 'null'
          echo "value=$digest" >> "$GITHUB_OUTPUT"

      - name: Attest GHCR image SBOM
        uses: actions/attest@v4
        with:
          subject-name: ${{ env.GHCR_IMAGE }}
          subject-digest: ${{ steps.digest.outputs.value }}
          sbom-path: sbom-${{ matrix.arch }}.spdx.json
          push-to-registry: true

  publish-manifest:
    name: Publish multi-platform manifest
    needs: build-test-push
    runs-on: ubuntu-latest
    permissions:
      attestations: write
      contents: read
      id-token: write
      packages: write
    env:
      DOCKER_IMAGE: docker.io/${{ secrets.DOCKERHUB_USERNAME }}/bladevault
      GHCR_IMAGE: ghcr.io/${{ github.repository }}

    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Publish manifests
        id: manifest
        shell: bash
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          short_sha="${GITHUB_SHA::7}"

          publish_manifest() {
            local repository="$1"
            local tags=(--tag "${repository}:sha-${short_sha}")

            if [[ "$GITHUB_REF" == refs/tags/* ]]; then
              tags+=(--tag "${repository}:${GITHUB_REF_NAME}")
            fi
            if [[ "$GITHUB_REF" == "refs/heads/${DEFAULT_BRANCH}" ]]; then
              tags+=(--tag "${repository}:latest")
            fi

            docker buildx imagetools create \
              "${tags[@]}" \
              "${repository}:sha-${short_sha}-amd64" \
              "${repository}:sha-${short_sha}-arm64"

            docker buildx imagetools inspect \
              "${repository}:sha-${short_sha}" \
              --raw \
              | jq -e '[.manifests[] | select(.platform.os == "linux") | .platform.architecture] | sort == ["amd64", "arm64"]'
          }

          publish_manifest "$GHCR_IMAGE"
          publish_manifest "$DOCKER_IMAGE"

          digest="$(docker buildx imagetools inspect \
            "${GHCR_IMAGE}:sha-${short_sha}" \
            --format '{{json .Manifest}}' | jq -r '.digest')"
          test "$digest" != 'null'
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - name: Attest GHCR image provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: ${{ env.GHCR_IMAGE }}
          subject-digest: ${{ steps.manifest.outputs.digest }}
          push-to-registry: true
