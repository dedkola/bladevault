name: Desktop Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing release tag to rebuild for macOS
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        # Avoid the arm64 hosted-runner capacity shortage. macOS still ships arm64.
        os: ${{ fromJSON(github.event_name == 'workflow_dispatch' && '["macos-15-intel"]' || '["macos-15-intel","windows-latest"]') }}

    runs-on: ${{ matrix.os }}

    steps:
      - name: Check out release tooling
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      - name: Preserve macOS release verifier
        if: runner.os == 'macOS'
        run: cp scripts/verify-macos-release.cjs "$RUNNER_TEMP/verify-macos-release.cjs"

      - name: Check out recovery release
        if: github.event_name == 'workflow_dispatch'
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.release_tag }}

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          cache: npm
          node-version-file: '.nvmrc'

      - name: Install dependencies
        run: npm ci

      - name: Validate recovery release
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          expected_tag="v$(node -p "require('./package.json').version")"
          if [ "$RELEASE_TAG" != "$expected_tag" ]; then
            echo "::error::Release tag must match the checked-out package version ($expected_tag)."
            exit 1
          fi
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json tagName

      - name: Detect macOS signing credentials
        if: runner.os == 'macOS'
        env:
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_SIGNING_CERTIFICATE_BASE64: ${{ secrets.APPLE_SIGNING_CERTIFICATE_BASE64 }}
          APPLE_SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_SIGNING_CERTIFICATE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail

          if [ -n "$APPLE_SIGNING_CERTIFICATE_BASE64" ] && [ -n "$APPLE_SIGNING_CERTIFICATE_PASSWORD" ] && [ -n "$APPLE_ID" ] && [ -n "$APPLE_APP_SPECIFIC_PASSWORD" ] && [ -n "$APPLE_TEAM_ID" ]; then
            echo "BLADEVAULT_MAC_SIGN=1" >> "$GITHUB_ENV"
            echo "BLADEVAULT_MAC_NOTARIZE=1" >> "$GITHUB_ENV"
            echo "BLADEVAULT_MAC_RELEASE_KIND=signed" >> "$GITHUB_ENV"
          else
            echo "BLADEVAULT_MAC_SIGN=0" >> "$GITHUB_ENV"
            echo "BLADEVAULT_MAC_NOTARIZE=0" >> "$GITHUB_ENV"
            echo "BLADEVAULT_MAC_RELEASE_KIND=unsigned" >> "$GITHUB_ENV"
          fi

      - name: Import Apple Developer ID certificate
        if: runner.os == 'macOS' && env.BLADEVAULT_MAC_SIGN == '1'
        env:
          APPLE_SIGNING_CERTIFICATE_BASE64: ${{ secrets.APPLE_SIGNING_CERTIFICATE_BASE64 }}
          APPLE_SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_SIGNING_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail

          CERT_PATH="$RUNNER_TEMP/bladevault-macos-cert.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/bladevault-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 24)"

          CERT_PATH="$CERT_PATH" APPLE_SIGNING_CERTIFICATE_BASE64="$APPLE_SIGNING_CERTIFICATE_BASE64" node -e "require('fs').writeFileSync(process.env.CERT_PATH, Buffer.from(process.env.APPLE_SIGNING_CERTIFICATE_BASE64, 'base64'))"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security default-keychain -d user -s "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$APPLE_SIGNING_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          EXISTING_KEYCHAINS=$(security list-keychains -d user | tr -d '"' | tr '\n' ' ')
          security list-keychains -d user -s "$KEYCHAIN_PATH" $EXISTING_KEYCHAINS

      - name: Build desktop runtime
        run: npm run build:desktop

      - name: Install macOS arm64 runtime dependencies
        if: runner.os == 'macOS'
        # Build Next.js with host binaries first, then install the locked arm64
        # optional dependencies (including sharp/libvips) for the shipped app.
        # Skip install scripts so they cannot regenerate host-architecture binaries.
        run: npm ci --os=darwin --cpu=arm64 --include=optional --ignore-scripts

      - name: Build desktop app
        shell: bash
        env:
          DESKTOP_ARCH: ${{ runner.os == 'macOS' && 'arm64' || 'x64' }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # macOS runners can start after the release has been published for two hours.
          EP_GH_IGNORE_TIME: 'true'
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          npm run rebuild:desktop-native -- --arch="$DESKTOP_ARCH"
          npm run sync:desktop-runtime
          if [ "$RUNNER_OS" = "macOS" ]; then
            lipo -verify_arch arm64 .next/standalone/node_modules/better-sqlite3/prebuilds/darwin-arm64.node
            lipo -verify_arch arm64 .next/standalone/node_modules/@img/sharp-darwin-arm64/lib/*.node
            lipo -verify_arch arm64 .next/standalone/node_modules/@img/sharp-libvips-darwin-arm64/lib/*.dylib
          fi
          npx electron-builder --config electron-builder.config.cjs --"$DESKTOP_ARCH" --publish always

      - name: Verify packaged macOS arm64 binaries
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          app_contents="dist/desktop/mac-arm64/BladeVault.app/Contents"
          runtime_modules="$app_contents/Resources/app.asar.unpacked/.next/standalone/node_modules"
          lipo -verify_arch arm64 "$app_contents/MacOS/BladeVault"
          lipo -verify_arch arm64 "$runtime_modules/better-sqlite3/prebuilds/darwin-arm64.node"
          lipo -verify_arch arm64 "$runtime_modules"/@img/sharp-darwin-arm64/lib/*.node
          lipo -verify_arch arm64 "$runtime_modules"/@img/sharp-libvips-darwin-arm64/lib/*.dylib

      - name: Verify macOS desktop app
        if: runner.os == 'macOS'
        # Recovery builds use the workflow's corrected verifier with tagged app sources.
        run: node "$RUNNER_TEMP/verify-macos-release.cjs"

      - name: Verify published macOS assets
        if: runner.os == 'macOS'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          set -euo pipefail
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json assets > "$RUNNER_TEMP/macos-release-assets.json"
          node - "$RUNNER_TEMP/macos-release-assets.json" <<'NODE'
          const fs = require('node:fs')
          const { assets } = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'))
          const expected = ['BladeVault.dmg', 'BladeVault.dmg.blockmap', 'BladeVault.zip', 'BladeVault.zip.blockmap', 'latest-mac.yml']
          const missing = expected.filter(name => !assets.some(asset => asset.name === name && asset.size > 0))
          if (missing.length) {
            throw new Error(`Missing macOS release assets: ${missing.join(', ')}`)
          }
          console.log('All macOS release assets are published.')
          NODE
