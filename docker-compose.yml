services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: ghcr.io/dedkola/bladevault:latest
    container_name: bladevault
    ports:
      - '5500:3000'
    volumes:
      - bladevault-data:/app/data
    environment:
      NODE_ENV: production
      PORT: 3000
      BLADEVAULT_DATA_DIR: /app/data
      MCP_AUTH_TOKEN: ${MCP_AUTH_TOKEN:-}
      MCP_ALLOWED_HOSTS: ${MCP_ALLOWED_HOSTS:-localhost,127.0.0.1}
      MCP_ALLOWED_ORIGINS: ${MCP_ALLOWED_ORIGINS:-}
      NEXT_PUBLIC_BLADEVAULT_AUTH_URL: ${NEXT_PUBLIC_BLADEVAULT_AUTH_URL:-}
      NEXT_PUBLIC_BLADEVAULT_BACKUP_URL: ${NEXT_PUBLIC_BLADEVAULT_BACKUP_URL:-}

volumes:
  bladevault-data:
